[project]
name = "urbandocs-evals"
version = "0.1.0"
description = "End-to-end eval harness: pydantic-ai agent as a real MCP client, LiteLLM model routing, Langfuse-tracked experiments (#85)"
readme = "README.md"
requires-python = ">=3.14"

# Self-contained, like tools/docling-convert (#46): own pyproject.toml and
# uv.lock, resolved independently of the root project. `urbandocs.server`'s
# production `dependencies` list (currently just `mcp`) is untouched by this.
dependencies = [
    "langfuse>=4.16.0",
    "pydantic-ai-slim[mcp,openai]>=2.52.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
urbandocs-evals = "urbandocs_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urbandocs_evals"]

[tool.pytest.ini_options]
minversion = "9"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.uv]
package = true
